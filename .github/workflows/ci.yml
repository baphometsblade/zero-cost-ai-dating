# Continuous integration for zero-cost-ai-dating.
#
# Three jobs, deliberately kept apart:
#
#   verify — the project has zero runtime and zero dev dependencies, so there is nothing
#     to install: check out the repo, confirm the generated seed bundle is still in sync
#     with seed/profiles.json, and run the Node built-in test runner. It stays that way.
#
#   e2e — the DOM-driven flows no unit test can reach (sign-in, the deck, matching, chat,
#     reports, offline). Playwright is what drives them, and it is installed into the
#     runner's temp directory rather than the repo, so package.json keeps its empty
#     dependency lists. The install is its own step: when the Playwright download fails
#     the job fails there, on a step named for infrastructure, and never as a red test.
#
#   emulator — the two suites that need a real Firestore. firestore.rules executed
#     against it, because it is the only server-side security this app has and "we read
#     it carefully" is not evidence; and the shipped public/js/data-store.js driven
#     against it, because the daily usage counter is only atomic if a transaction says
#     so under real contention. Both run inside a single `emulators:exec`, since booting
#     the emulator costs far more than either suite. Same arrangement as e2e: emulator
#     and testing libraries installed into the runner's temp directory, never into the
#     repository.
#
# No secrets, no deploy step — Firebase deploys stay a deliberate local `npm run
# deploy`; the GitHub Pages demo has its own workflow (pages.yml), which only ever
# runs after a merge to main and so only ever publishes what these jobs let through.
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

# Read-only token: nothing in this workflow writes back to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Verify seed and run tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # package.json advertises engines >= 18, so the suite is run on more than one major.
    # Pinning a single version once hid a real breakage: the test runner's handling of a
    # positional directory argument changed after Node 20, so `npm test` silently ran no
    # tests at all on newer runtimes while CI stayed green.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      # Fetch the sources under test. Action majors are kept current rather than
      # pinned to whatever worked once: GitHub retires the Node runtime an action
      # major targets, and a workflow left behind starts as a warning on every run
      # and ends as a failure. There is no lockfile here to hold them back, since
      # this project installs nothing.
      - name: Check out repository
        uses: actions/checkout@v7

      # Node 20 LTS and the next LTS line; package.json requires >= 18.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # public/js/seed-data.js is generated from seed/profiles.json — fail if it drifted.
      - name: Check generated seed bundle is up to date
        run: npm run check:seed

      # node --test discovers tests/*.test.js — matching engine, seed schema, static HTML.
      # It does not discover e2e/specs/*.e2e.js, which is why the browser suite can live
      # in the repo without this job ever needing a browser.
      - name: Run tests
        run: npm test

      # The one number no test inside the run can see: `npm test`'s own total, which the
      # README quotes. This runs the suite again in a child process and reads the count
      # back out of its TAP summary — under a second, and the only way the claim can be
      # checked at all. See scripts/claims.js for why the totals are enforced from both
      # ends; the other three suites check their own.
      - name: Check the unit total matches what the README claims
        run: npm run check:claims

  e2e:
    name: Browser end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One Node version is enough here: what is under test is the code running inside
    # Chromium, not Node's own behaviour. The verify job covers the runtime matrix.
    env:
      PLAYWRIGHT_VERSION: '1.56.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Infrastructure, not a test. Playwright is installed under the runner's temp
      # directory and the browser is fetched with the same pinned version, so the module
      # and the Chromium revision it expects can never disagree. Nothing lands in the
      # repository: `dependencies` and `devDependencies` stay empty, which is the whole
      # promise of the verify job above.
      - name: Install Playwright and Chromium (infrastructure)
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" "playwright@$PLAYWRIGHT_VERSION"
          npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium

      # e2e/run.js resolves Playwright through NODE_PATH; if it cannot find it at all it
      # exits 3 with a one-line install hint rather than a stack trace.
      #
      # Deliberately with no emulator running: this is the run every contributor gets
      # with nothing installed, so it also proves the Firebase spec skips cleanly
      # instead of failing — or, worse, passing without having connected to anything.
      - name: Run the end-to-end suite
        run: npm run test:e2e
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules

      # The Firebase spec is the only browser coverage of the path that talks to a real
      # Firestore, and it skips itself when no emulator answers — so without these last
      # two steps it would skip here forever and the checks would run on nobody's
      # machine but the author's. Java and the CLI are infrastructure, same arrangement
      # as everywhere else: the runner's temp directory, never the repository.
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # emulators:exec boots Firestore (8080) and Auth (9099) on their default ports —
      # which is what e2e/specs/10-firebase.e2e.js looks for — loads the real
      # firestore.rules from firebase.json, and tears them down afterwards. The browser
      # reaches them through the page's own origin, so the shipped CSP is untouched.
      #
      # The whole suite rather than the Firebase spec alone, for one reason: this is the
      # only run in which every spec executes, so it is the only run that can hold the
      # README's emulator-inclusive total to account. A filtered run counts less by
      # design and the runner does not check it. Costs about a minute; the alternative is
      # a number in the README that nothing verifies. See scripts/claims.js.
      - name: Run the whole suite against the emulators
        run: |
          npm install --prefix "$RUNNER_TEMP/emulator" "firebase-tools@$FIREBASE_TOOLS_VERSION"
          "$RUNNER_TEMP/emulator/node_modules/.bin/firebase" emulators:exec \
            --only firestore,auth --project demo-zc-browser \
            "node e2e/run.js"
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          FIREBASE_TOOLS_VERSION: '15.26.0'

  emulator:
    name: Firestore emulator (rules and store)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Pinned together: the emulator is fetched by this exact CLI version, so a
    # surprise release cannot change what the rules are executed against, and the
    # client SDK version decides the compat API shape the store suite drives.
    env:
      FIREBASE_TOOLS_VERSION: '15.26.0'
      RULES_TESTING_VERSION: '5.0.1'
      FIREBASE_SDK_VERSION: '12.18.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The Firestore emulator is a Java program. ubuntu-latest ships a JDK, but
      # pinning one keeps the job from breaking when the image's default moves.
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Infrastructure, not a test — same arrangement as the e2e job. Installed
      # under the runner's temp directory so `dependencies` and `devDependencies`
      # stay empty in the repository. `firebase` is the client SDK: the store
      # suite loads the shipped data-store.js against its compat build.
      - name: Install the emulator and testing libraries (infrastructure)
        run: |
          npm install --prefix "$RUNNER_TEMP/emulator" \
            "firebase-tools@$FIREBASE_TOOLS_VERSION" \
            "@firebase/rules-unit-testing@$RULES_TESTING_VERSION" \
            "firebase@$FIREBASE_SDK_VERSION"

      # One boot, both suites: firestore.rules executed against the emulator, then
      # the real public/js/data-store.js driven against it. Exits 3 if the tooling
      # is missing, which reads as infrastructure rather than as a failing test.
      - name: Run the rules and store suites
        run: npm run test:emulator
        env:
          NODE_PATH: ${{ runner.temp }}/emulator/node_modules
