# The live demo, deployed to GitHub Pages.
#
# The app runs fully without a Firebase project — the data-store falls back to
# localStorage with a bundled cast — which means the demo can be *hosted* for the same
# $0 the rest of the project costs: publish public/ as a project site at
# https://baphometsblade.github.io/zero-cost-ai-dating/ and there is nothing else to run.
#
# Two things about Pages shaped the code rather than this file, and are worth knowing
# when reading it:
#
#   - A project site lives under a subpath, not the origin root. Every link in the app
#     is relative for exactly this reason, the manifest's scope is './', and sw.js
#     derives its base from its own URL instead of assuming '/'.
#
#   - Pages cannot set HTTP response headers. The Content-Security-Policy that Firebase
#     Hosting sends as a header therefore also ships as a <meta> tag in every page
#     (tests/csp-sync.test.js holds the two in lockstep); the remaining headers exist
#     only on Firebase Hosting, which stays the recommended host for a real deployment —
#     see docs/DEPLOY.md.
#
# Publishes main's tip, and only once the CI workflow has passed on that exact commit.
# This used to run on every push to main, beside CI rather than after it, so nothing
# waited for the browser and emulator suites; and main is not a protected branch, so
# nothing stopped a commit CI failed from going out (2581d89 failed CI on main, and
# this workflow started a deploy of it all the same). Now CI finishing on main is what
# wakes this up, and the gate job asks the API whether CI passed on the commit about to
# go out. Firebase deploys are unaffected and stay a deliberate local `npm run deploy`.
name: pages

on:
  # Fires when a CI run on main completes, whatever its result; the jobs below decide.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Re-deploys main by hand, through the same gate.
  workflow_dispatch:

# Nothing by default; each job asks for what it uses.
permissions: {}

# One deploy at a time, and never cancel a running one: a half-cancelled deploy can
# leave the site on an artifact no commit points at.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Check CI passed on the commit to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # workflow_dispatch runs against whatever ref the person dispatching picks, so
    # without the ref test a manual run could publish an unmerged branch. A
    # workflow_run always runs on the default branch, and only a CI run that passed
    # on a push to main is worth waking for.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'))

    # Reading workflow runs is all this job does.
    permissions:
      actions: read

    outputs:
      sha: ${{ steps.ci.outputs.sha }}

    steps:
      # What gets published is github.sha, main's tip when this run started — never
      # the triggering run's head_sha, so a pull request's CI run cannot choose what
      # is published. The tip is not always the commit whose CI just finished: after
      # two quick pushes the older one's CI can finish last. So the question is put
      # about the tip itself, and when CI has not passed on it (yet) nothing is
      # published: the tip's own CI run wakes this workflow again when it finishes.
      - name: Ask whether CI passed on main's tip
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success" --jq '.total_count')
          if [ "$passed" -gt 0 ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CI has not passed on $GITHUB_SHA, so nothing is published."
          fi

  deploy:
    name: Publish the demo to GitHub Pages
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The deploy needs exactly what actions/deploy-pages documents: pages to publish,
    # id-token for the OIDC handshake that proves the artifact came from this workflow.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The commit the gate checked, by hash, so a push landing in between cannot
      # swap in one it did not.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The suite is dependency-free and runs in seconds; a shell the unit tests
      # reject must never be published, even though the gate has already seen CI
      # pass on this commit.
      - name: Run tests before publishing
        run: npm test

      # enablement asks GitHub to create the Pages site if it does not exist yet,
      # but the Actions token is not allowed to create one ("Resource not
      # accessible by integration"), so the site has to be switched on once by
      # hand: Settings -> Pages -> Build and deployment -> Source: GitHub
      # Actions. docs/DEPLOY.md spells that out. Once it exists this step finds
      # it and does nothing, which is why the flag stays: a fork that *is*
      # allowed to self-enable gets that for free, and everyone else sees the
      # failure here, on a step named for configuration, rather than as a
      # mysterious 404 on the published URL.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # public/ is the whole site: no build step exists anywhere in this project,
      # and what is uploaded is byte-for-byte what the repository carries.
      - name: Upload public/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
